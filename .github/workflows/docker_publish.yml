name: Build and Push Docker Image

on:
  push:
    branches:
      - salary-prediction-docker-ghactions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_ACTIONS }}" | docker login -u jannatbuttmlops --password-stdin

      - name: Build Docker image
        run: docker build -t jannatbuttmlops/docker-prediction-model:latest .

      - name: Push Docker image
        run: docker push jannatbuttmlops/docker-prediction-model:latest
